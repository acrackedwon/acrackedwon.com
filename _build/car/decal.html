<!doctype html><meta charset="utf-8"><body style="margin:0;background:#f2f2f0">
<canvas id="c" width="1400" height="800"></canvas>
<script type="module">
import * as THREE from './vendor/three.module.min.js';

import { GLTFExporter } from './vendor/GLTFExporter.js';

const g = await new GLTFLoader().loadAsync(q.get('f')); const root = g.scene;

window.shot = (az, el, z, t) => {
  const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3()), ctr = t ? V(t) : box.getCenter(new THREE.Vector3());
  const R = Math.max(size.x, size.y, size.z) * z, A = az * Math.PI / 180, E = el * Math.PI / 180;

</script>
