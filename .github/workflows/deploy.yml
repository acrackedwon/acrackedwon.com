name: Deploy to GitHub Pages

# 정적 사이트(자체 완결형 index.html)를 GitHub Pages에 배포한다.
# 아직 main 머지 전이라 작업 브랜치에서도 배포되게 해둠. 도메인 붙이고 main으로
# 정리되면 branches를 [main]만 남기면 된다. 수동 실행도 가능(workflow_dispatch).
on:
  push:
    branches: [main, claude/erin-jung-design-analysis-w71yac]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 — 새 푸시가 오면 진행 중이던 배포는 취소
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 배포에 필요한 파일만 _site/에 모은다 (index.html은 이미 모든 이미지·폰트를 인라인한
      # 자체 완결형이라 다른 파일이 필요 없음). CNAME은 커스텀 도메인 유지용.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f CNAME ] && cp CNAME _site/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
